<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>looparr</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="looparr">
      <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="looparr">
        <defs>
          <linearGradient id="headerLooparrStroke" x1="6" y1="32" x2="58" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="0.5" stop-color="#818cf8"/>
            <stop offset="1" stop-color="#34d399"/>
          </linearGradient>
          <filter id="headerLooparrGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="1.8" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect width="64" height="64" rx="15" fill="#0d1421"/>
        <path d="M32 32c-4.7-7-10.4-9.6-15.2-7.3C11 27.4 9.2 35.4 14.2 40c4.4 4.1 11.2 2.5 17.8-8Zm0 0c4.7 7 10.4 9.6 15.2 7.3C53 36.6 54.8 28.6 49.8 24c-4.4-4.1-11.2-2.5-17.8 8Z"
              fill="none" stroke="url(#headerLooparrStroke)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#headerLooparrGlow)"/>
        <g stroke="#a5f3fc" stroke-width="1.3" stroke-linecap="round" opacity="0.9">
          <path d="M18 24v-5m0 5h-5m5 0 4.5-4.5"/>
          <path d="M46 40v5m0-5h5m-5 0-4.5 4.5"/>
        </g>
        <g fill="#e0f2fe" filter="url(#headerLooparrGlow)">
          <circle cx="18" cy="24" r="2.4"/>
          <circle cx="13" cy="24" r="1.7"/>
          <circle cx="22.5" cy="19.5" r="1.7"/>
          <circle cx="46" cy="40" r="2.4"/>
          <circle cx="51" cy="40" r="1.7"/>
          <circle cx="41.5" cy="44.5" r="1.7"/>
        </g>
        <g fill="#fde68a" filter="url(#headerLooparrGlow)">
          <path d="M20.5 36.5l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1 1-2.7Z"/>
          <path d="M43.5 27.5l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1 1-2.7Z"/>
        </g>
      </svg>
      <span class="brand-word">looparr</span>
    </div>
    <div class="connection" id="connection"><span class="dot"></span><span id="connection-text">connecting</span></div>
  </header>

  <main class="page">
    <section class="panel" aria-labelledby="settings-heading">
      <div class="panel-heading">
        <h2 id="settings-heading">Settings</h2>
        <span class="muted" id="settings-status"></span>
      </div>
      <form class="settings-bar" id="settings-form">
        <label class="field">
          <span>Max concurrent workers <small>0 = unlimited</small></span>
          <input type="number" id="max-concurrent" min="0" max="10000" step="1" value="2">
        </label>
        <label class="field">
          <span>Execution mode</span>
          <select id="mode">
            <option value="parallel">Parallel Pool</option>
            <option value="roundrobin">Round-Robin</option>
          </select>
        </label>
        <label class="field">
          <span>Global runner</span>
          <select id="global-runner"></select>
        </label>
        <label class="field">
          <span>Rate-limit pause <small>seconds</small></span>
          <input type="number" id="rate-limit-seconds" min="5" max="600" step="1" value="60">
        </label>
        <button class="button primary" type="submit">Save settings</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="add-heading">
      <div class="panel-heading">
        <h2 id="add-heading">Add Project</h2>
        <span class="muted" id="add-status"></span>
      </div>
      <form class="add-bar" id="add-form">
        <label class="field grow">
          <span>Project directory</span>
          <input type="text" id="project-path" placeholder="/path/to/project" autocomplete="off" required>
        </label>
        <button class="button" type="button" id="browse-button">Browse</button>
        <input type="file" id="folder-picker" webkitdirectory directory multiple hidden>
        <label class="field">
          <span>Display name <small>optional</small></span>
          <input type="text" id="project-name" placeholder="folder name" autocomplete="off">
        </label>
        <label class="field">
          <span>Runner</span>
          <select id="project-runner"></select>
        </label>
        <button class="button primary" type="submit">Add project</button>
      </form>
    </section>

    <section class="projects-section" aria-labelledby="projects-heading">
      <div class="panel-heading">
        <h2 id="projects-heading">Projects</h2>
        <span class="muted" id="project-count"></span>
      </div>
      <div class="project-grid" id="project-grid"></div>
      <div class="empty-state" id="empty-state" hidden>No projects yet. Add a directory with a plan.md file to begin.</div>
    </section>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-header">
      <div>
        <h2 id="drawer-title">Project</h2>
        <p class="muted mono" id="drawer-path"></p>
      </div>
      <button class="icon-button" id="drawer-close" type="button" aria-label="Close project details">✕</button>
    </div>
    <div class="drawer-body">
      <div class="drawer-status-row">
        <span class="badge" id="drawer-status">Idle</span>
        <span class="muted" id="drawer-task"></span>
      </div>

      <section class="drawer-section">
        <div class="section-heading">
          <h3>plan.md</h3>
          <span class="muted" id="plan-status"></span>
        </div>
        <div class="checklist" id="checklist"></div>
        <textarea id="plan-editor" class="plan-editor" spellcheck="false" aria-label="Edit plan.md"></textarea>
        <div class="editor-actions">
          <button class="button primary small" id="save-plan" type="button">Save plan.md</button>
          <span class="muted small-text">Edits are live; the engine watches plan.md.</span>
        </div>
      </section>

      <section class="drawer-section">
        <div class="section-heading">
          <h3>Logs</h3>
          <span class="muted small-text">stdout / stderr</span>
        </div>
        <div class="log-list mono" id="log-list"></div>
      </section>
    </div>
  </aside>

  <script src="/app.js" defer></script>
</body>
</html>
