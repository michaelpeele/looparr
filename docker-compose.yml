name: looparr

services:
  looparr:
    build: .
    image: looparr:latest
    container_name: looparr
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CONFIG_PATH: /app/data/config.json
      ENV_PATH: /app/.env
      HOME: /home/michaelpeele
      HOSTNAME: looparr
      LOOPARR_EXECUTOR_URL: ${LOOPARR_EXECUTOR_URL:-http://172.17.0.1:4187}
      LOOPARR_EXECUTOR_TOKEN: ${LOOPARR_EXECUTOR_TOKEN:-}
    volumes:
      - ./data:/app/data:rw
      - ./.env:/app/.env:rw
      - ${LOOPARR_PROJECTS_ROOT:-/home/michaelpeele/ai-projects}:${LOOPARR_PROJECTS_ROOT:-/home/michaelpeele/ai-projects}:rw
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/state').then(async r => { if (!r.ok) process.exit(1); await r.text(); process.exit(0); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 15s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-looparr
    hostname: looparr
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN:-looparr.tail0307d.ts.net}
      TS_ACCEPT_DNS: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - ./looparr-tailscale-data:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    ports:
      - "${LOOPARR_LOCAL_PORT:-4188}:3000"
